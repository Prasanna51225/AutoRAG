services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: autoreag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - autoreag_net

  redis:
    image: redis:7-alpine
    container_name: autoreag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1
    restart: unless-stopped
    networks:
      - autoreag_net

  ollama:
    image: ollama/ollama:latest
    container_name: autoreag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - autoreag_net
    entrypoint: /bin/sh
    command: >
      -c "ollama serve &
      sleep 5 &&
      ollama pull llama3.2:3b &&
      wait"

  backend:
    build: .
    container_name: autoreag_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - EMBEDDING_CACHE_TTL=3600
      - RERANKER_MODEL=BAAI/bge-reranker-base
      - RERANKER_CUTOFF=50
      - MAX_LOOPS=3
      - CRITIC_THRESHOLD=0.3
      - HYBRID_ALPHA=0.6
      - DYNAMIC_TOPK=true
      - CHUNK_SIZE=1024
      - CHUNK_OVERLAP=256
      - CUDA_VISIBLE_DEVICES=
    volumes:
      - ./backend:/app
    depends_on:
      - qdrant
      - redis
      - ollama
    restart: unless-stopped
    networks:
      - autoreag_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    container_name: autoreag_celery
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - RERANKER_CUTOFF=50
      - CRITIC_THRESHOLD=0.3
      - CUDA_VISIBLE_DEVICES=
      - OMP_NUM_THREADS=1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped
    networks:
      - autoreag_net
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 --pool=solo

  prometheus:
    image: prom/prometheus:latest
    container_name: autoreag_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - autoreag_net

  grafana:
    image: grafana/grafana:latest
    container_name: autoreag_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - autoreag_net

  frontend:
    build: ./frontend
    container_name: autoreag_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - autoreag_net

networks:
  autoreag_net:
    driver: bridge

volumes:
  qdrant_storage:
  redis_data:
  ollama_models:
  prometheus_data:
  grafana_data: