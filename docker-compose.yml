services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: autoreag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - autoreag_net

  redis:
    image: redis:7-alpine
    container_name: autoreag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1
    restart: unless-stopped
    networks:
      - autoreag_net

  ollama:
    image: ollama/ollama:latest
    container_name: autoreag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    networks:
      - autoreag_net
    command: >
      sh -c "ollama serve & sleep 5 && ollama pull llama3.2:3b && wait"

  backend:
    build: .
    container_name: autoreag_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - REDIS_URL=${REDIS_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - EMBEDDING_CACHE_TTL=${EMBEDDING_CACHE_TTL}
      - RERANKER_MODEL=${RERANKER_MODEL}
      - RERANKER_CUTOFF=${RERANKER_CUTOFF}
      - MAX_LOOPS=${MAX_LOOPS}
      - CRITIC_THRESHOLD=${CRITIC_THRESHOLD}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    volumes:
      - ./backend:/app
    depends_on:
      - qdrant
      - redis
      - ollama
    restart: unless-stopped
    networks:
      - autoreag_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    container_name: autoreag_celery
    environment:
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - REDIS_URL=${REDIS_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - EMBEDDING_CACHE_TTL=${EMBEDDING_CACHE_TTL}
      - RERANKER_MODEL=${RERANKER_MODEL}
      - RERANKER_CUTOFF=${RERANKER_CUTOFF}
      - MAX_LOOPS=${MAX_LOOPS}
      - CRITIC_THRESHOLD=${CRITIC_THRESHOLD}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped
    networks:
      - autoreag_net
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2

  prometheus:
    image: prom/prometheus:latest
    container_name: autoreag_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - autoreag_net

  grafana:
    image: grafana/grafana:latest
    container_name: autoreag_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - autoreag_net

networks:
  autoreag_net:
    driver: bridge

volumes:
  qdrant_storage:
  redis_data:
  ollama_models:
  prometheus_data:
  grafana_data: